<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Famaash Chat</title>
    <!--
      The widget's font is Manrope (t102442, Nov 2), a Google font, for the chrome and the messages alike. A firm
      that picked another font in Branding gets that one loaded at runtime instead (config/theme.ts applyFont).
      Loaded via CDN for now; self-hosting (@fontsource) is tracked in the spec's deferred list.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/widget/main.tsx"></script>
  </body>
</html>
